<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>FluidLab 3D — симуляция жидкости в реальном времени</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="gl"></canvas>

<div id="loading">
  <div class="spinner"></div>
  <div class="ltitle">FluidLab 3D</div>
  <div class="lsub">инициализация GPU-решателя…</div>
</div>

<div id="panel">
  <header>
    <div class="brand">
      <div class="logo"></div>
      <div>
        <h1>FLUID<span>LAB</span></h1>
        <div class="tag">Position Based Fluids · GPU</div>
      </div>
    </div>
    <button id="collapse" title="Свернуть панель">‹</button>
  </header>

  <div class="stats">
    <div class="stat"><b id="s-fps">–</b><span>FPS</span></div>
    <div class="stat"><b id="s-part">–</b><span>частиц</span></div>
    <div class="stat"><b id="s-ms">–</b><span>мс</span></div>
  </div>

  <div class="scroll">
    <details open>
      <summary>Уровень</summary>
      <div class="sec-body" id="levels"></div>
    </details>

    <details open>
      <summary>Небо и фон</summary>
      <div class="sec-body" id="skies"></div>
    </details>

    <details open>
      <summary>Источники</summary>
      <div class="sec-body" id="sources"></div>
    </details>

    <details open>
      <summary>Объекты сцены</summary>
      <div class="sec-body" id="objects"></div>
    </details>

    <details open>
      <summary>Физика</summary>
      <div class="sec-body" id="phys"></div>
    </details>

    <details>
      <summary>Производительность</summary>
      <div class="sec-body" id="perf"></div>
    </details>

    <details open>
      <summary>Сцена</summary>
      <div class="sec-body">
        <div class="btnrow">
          <button class="btn primary" id="btn-reset">Сброс жидкости</button>
          <button class="btn" id="btn-pause">Пауза</button>
        </div>
        <div class="btnrow">
          <button class="btn" id="btn-rotate">Авто-вращение</button>
          <button class="btn" id="btn-preset">Водоворот</button>
        </div>
        <div class="btnrow">
          <button class="btn" id="btn-clear">Убрать объекты</button>
        </div>
        <div class="btnrow">
          <button class="btn" id="btn-resetall">Сбросить настройки</button>
        </div>
      </div>
    </details>
  </div>

  <footer>
    <span>ЛКМ — орбита · КОЛЕСО — зум</span>
    <span>ПКМ / Shift — толкать · клик по объекту — стрелки</span>
  </footer>
</div>

<div id="inspector"></div>

<button id="expand" title="Показать панель">›</button>

<div id="hint">Кликните по объекту, чтобы двигать его стрелками</div>

<div id="error" hidden></div>

<script src="js/math.js"></script>
<script src="js/gl.js"></script>
<script src="js/world.js"></script>
<script src="js/store.js"></script>
<script src="js/gizmo.js"></script>
<script src="js/shaders.js"></script>
<script src="js/sim.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
